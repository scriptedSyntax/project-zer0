<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Register - THE GENESIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'hacker-green': '#00ff00',
                        'money-gold': '#FFD700',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s ease-in-out infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'blink': 'blink 1s infinite alternate'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        },
                        blink: {
                            from: { opacity: 0.3 },
                            to: { opacity: 1 }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: black;
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #FFD700;
            font-family: 'Courier New', Courier, monospace;
        }
        .coin {
            width: 70px;
            height: 70px;
            background-image: url('/favicon.png');
            background-size: cover;
            animation: spin 1.2s linear infinite;
        }
        @keyframes spin {
            from { transform: rotateY(0); }
            to   { transform: rotateY(360deg); }
        }
    </style>
</head>
<body class="min-h-screen bg-black text-white flex items-center justify-center p-4 relative">

    <!-- Loading Animation -->
    <div id="loading-screen">
        <div class="coin"></div>
        <div class="text-xl mt-4 animate-blink">Registering your wallet...</div>
    </div>

    <!-- Main Register Card -->
    <div class="w-full max-w-md bg-gray-900 rounded-lg shadow-lg overflow-hidden border-2 border-hacker-green">
        <div class="p-6">
            <div class="flex flex-col items-center mb-6">
                <div class="relative">
                    <i class="bi bi-currency-bitcoin text-money-gold text-5xl animate-float"></i>
                    <i class="bi bi-person-circle text-orange-500 text-6xl absolute -top-3 -left-4 animate-pulse-slow"></i>
                </div>
                <h1 class="text-2xl font-bold mt-4 text-transparent bg-clip-text bg-gradient-to-r from-hacker-green to-money-gold">
                    Register to THE GENESIS
                </h1>
                <p class="text-hacker-green text-sm mt-1">Create your cash money identity</p>
            </div>

            <form id="register-form" method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="text-hacker-green text-sm">Username</label>
                    <input type="text" name="username" id="username" class="form-control bg-gray-800 text-white border border-hacker-green rounded mt-1" required>
                </div>
                <div>
                    <label class="text-hacker-green text-sm">Password</label>
                    <input type="password" name="password1" id="password1" class="form-control bg-gray-800 text-white border border-hacker-green rounded mt-1" required>
                </div>
                <div>
                    <label class="text-hacker-green text-sm">Confirm Password</label>
                    <input type="password" name="password2" id="password2" class="form-control bg-gray-800 text-white border border-hacker-green rounded mt-1" required>
                </div>
                <div id="error-msg" class="text-red-500 text-sm hidden"></div>
                <button type="submit"
                    class="w-full py-2 px-4 bg-gradient-to-r from-hacker-green to-money-gold text-black font-bold rounded-md hover:opacity-90 transition transform hover:scale-105">
                    <i class="bi bi-person-plus-fill mr-2"></i> Register
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-400 text-sm">
                    Already have an account?
                    <a href="{% url 'login' %}" id="login-link" class="text-hacker-green underline hover:text-money-gold transition">Login here</a>.
                </p>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const errorMsg = document.getElementById('error-msg');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const pass1 = document.getElementById('password1').value;
            const pass2 = document.getElementById('password2').value;

            if (!username || !pass1 || !pass2) {
                errorMsg.textContent = 'All fields are required.';
                errorMsg.classList.remove('hidden');
                return;
            }

            if (pass1.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters.';
                errorMsg.classList.remove('hidden');
                return;
            }

            if (pass1 !== pass2) {
                errorMsg.textContent = 'Passwords do not match.';
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            document.getElementById('loading-screen').style.display = 'flex';
            setTimeout(() => {
                form.submit();
            }, 2000);
        });

        const loginLink = document.getElementById('login-link');
        loginLink.addEventListener('click', function (e) {
            e.preventDefault();
            document.getElementById('loading-screen').style.display = 'flex';
            setTimeout(() => {
                window.location.href = this.href;
            }, 2000);
        });
    </script>
</body>
</html>
