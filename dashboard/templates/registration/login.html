<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Login - THE GENESIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'hacker-green': '#00ff00',
                        'money-gold': '#FFD700',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'blink': 'blink 1s infinite alternate'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        blink: {
                            '0%': { opacity: 0.3 },
                            '100%': { opacity: 1 }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            background: black;
            display: none;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
</head>
<body class="min-h-screen bg-black text-white flex items-center justify-center p-4 relative">

    <!-- Bitcoin Cinematic Loader -->
    <div id="loading-screen" class="text-money-gold">
        <i class="bi bi-currency-bitcoin text-7xl animate-float"></i>
        <p class="mt-4 text-lg font-mono animate-blink">Validating your account...</p>
    </div>

    <!-- Main Card -->
    <div class="w-full max-w-md bg-gray-900 rounded-lg shadow-lg overflow-hidden border-2 border-hacker-green">
        <div class="p-6">
            <div class="flex flex-col items-center mb-6">
                <div class="relative">
                    <i class="bi bi-currency-bitcoin text-money-gold text-5xl animate-float"></i>
                    <i class="bi bi-p-circle-fill text-orange-500 text-7xl absolute -top-2 -left-2 animate-pulse-slow"></i>
                </div>
                <h1 class="text-2xl font-bold mt-4 text-transparent bg-clip-text bg-gradient-to-r from-hacker-green to-money-gold">
                    THE GENESIS
                </h1>
                <p class="text-hacker-green text-sm mt-1">Secure Login Portal</p>
            </div>

            <form id="login-form" method="post" class="space-y-4">
                {% csrf_token %}
                <div class="space-y-2">
                    <label class="block text-hacker-green text-sm font-medium">Username</label>
                    <input type="text" name="username" required 
                        class="w-full px-4 py-2 bg-gray-800 border border-hacker-green rounded-md focus:outline-none focus:ring-2 focus:ring-hacker-green transition-all">
                </div>
                <div class="space-y-2">
                    <label class="block text-hacker-green text-sm font-medium">Password</label>
                    <input type="password" name="password" required 
                        class="w-full px-4 py-2 bg-gray-800 border border-hacker-green rounded-md focus:outline-none focus:ring-2 focus:ring-hacker-green transition-all">
                </div>
                <button type="submit" 
                    class="w-full py-2 px-4 bg-gradient-to-r from-hacker-green to-money-gold text-black font-bold rounded-md hover:opacity-90 transition-all transform hover:scale-105">
                    <i class="bi bi-lock-fill mr-2"></i> Login
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-400 text-sm">
                    Don't have an account? 
                    <p class="text-hacker-green font-semibold">Take care! Chunga</p>
                </p>
                <div class="flex justify-center space-x-4 mt-4">
                    <i class="bi bi-currency-dollar text-money-gold text-xl"></i>
                    <i class="bi bi-currency-euro text-money-gold text-xl"></i>
                    <i class="bi bi-currency-yen text-money-gold text-xl"></i>
                    <i class="bi bi-currency-pound text-money-gold text-xl"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('loading-screen').style.display = 'flex';
            setTimeout(() => {
                this.submit();
            }, 1000);
        });
    </script>
</body>
</html>
