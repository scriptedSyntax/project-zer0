<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>THE GENESIS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Tailwind config in style block for easy copy-paste */
        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        /* Define custom colors and animations */
        :root {
            --hacker-green: #00ff00;
            --money-gold: #FFD700;
            --orange-pumpkin: #ff7f00;
            --dark-bg: #1a1a1a;
            --card-bg: #2a2a2a;
            --border-color: #4a4a4a;
        }

        /* Extend Tailwind with custom animations */
        .animate-pulse-slow { animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        body {
            font-family: 'Consolas', 'Monaco', monospace; /* Hacker-style font */
            background-color: var(--dark-bg);
            color: #e0e0e0;
            overflow: hidden; /* Prevent scroll from overlays */
        }

        .bg-gray-900 { background-color: var(--card-bg) !important; }
        .border-hacker-green { border-color: var(--hacker-green) !important; }
        .text-hacker-green { color: var(--hacker-green) !important; }
        .text-money-gold { color: var(--money-gold) !important; }
        .text-orange-500 { color: var(--orange-pumpkin) !important; }

        .bg-gradient-to-r.from-hacker-green.to-money-gold {
            background-image: linear-gradient(to right, var(--hacker-green), var(--money-gold));
        }

        input[type="text"],
        input[type="password"] {
            background-color: #333 !important;
            color: var(--hacker-green) !important;
            border-color: var(--hacker-green) !important;
            padding: 0.75rem 1rem; /* Adjust padding for consistency */
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none !important;
            box-shadow: 0 0 0 2px var(--hacker-green) !important;
        }

        button[type="submit"] {
            color: black !important; /* Ensure text is black on gradient button */
        }

        /* Binary glitch overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                45deg,
                rgba(0, 255, 0, 0.05),
                rgba(0, 255, 0, 0.05) 1px,
                transparent 1px,
                transparent 5px
            ),
            repeating-linear-gradient(
                -45deg,
                rgba(0, 255, 0, 0.05),
                rgba(0, 255, 0, 0.05) 1px,
                transparent 1px,
                transparent 5px
            );
            background-size: 10px 10px;
            opacity: 0.2;
            z-index: -1;
            animation: binary-glow 10s infinite alternate;
        }

        @keyframes binary-glow {
            from { opacity: 0.15; }
            to { opacity: 0.25; }
        }

        /* Money pattern overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><text x="0" y="8" font-size="10" fill="%23FFD700" opacity="0.1">$</text></svg>');
            background-repeat: repeat;
            background-size: 10px 10px;
            opacity: 0.3;
            z-index: -1;
            animation: money-pulse 5s infinite ease-in-out;
        }

        @keyframes money-pulse {
            0% { opacity: 0.25; }
            50% { opacity: 0.35; }
            100% { opacity: 0.25; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-gray-900 rounded-lg shadow-lg overflow-hidden border-2 border-hacker-green relative z-10">
        <div class="p-6">
            <div class="flex flex-col items-center mb-6">
                <div class="relative">
                    <i class="bi bi-currency-bitcoin text-money-gold text-5xl animate-float"></i>
                    <i class="bi bi-p-circle-fill text-orange-500 text-7xl absolute -top-2 -left-2 animate-pulse-slow"></i>
                </div>
                <h1 class="text-2xl font-bold mt-4 text-transparent bg-clip-text bg-gradient-to-r from-hacker-green to-money-gold">
                    THE GENESIS
                </h1>
                <p class="text-hacker-green text-sm mt-1">Secure Login Portal</p>
            </div>

            <form method="post" class="space-y-4" id="login-form">
                {% csrf_token %}
                {% if form.non_field_errors %}
                    <div class="alert alert-danger" role="alert">
                        {% for error in form.non_field_errors %}
                            {{ error }}
                        {% endfor %}
                    </div>
                {% endif %}
                <div class="space-y-2">
                    <label class="block text-hacker-green text-sm font-medium" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" required
                        class="w-full px-4 py-2 bg-gray-800 border border-hacker-green rounded-md focus:outline-none focus:ring-2 focus:ring-hacker-green transition-all">
                </div>
                <div class="space-y-2">
                    <label class="block text-hacker-green text-sm font-medium" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" required
                        class="w-full px-4 py-2 bg-gray-800 border border-hacker-green rounded-md focus:outline-none focus:ring-2 focus:ring-hacker-green transition-all">
                </div>
                <button type="submit" id="login-button"
                    class="w-full py-2 px-4 bg-gradient-to-r from-hacker-green to-money-gold text-black font-bold rounded-md hover:opacity-90 transition-all transform hover:scale-105 flex items-center justify-center">
                    <span id="button-text"><i class="bi bi-lock-fill mr-2"></i> Login</span>
                    <span id="loading-spinner" class="spinner-border spinner-border-sm text-black ml-2 d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-400 text-sm">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="text-hacker-green font-semibold hover:underline">Register here</a>.
                </p>
                <div class="flex justify-center space-x-4 mt-4">
                    <i class="bi bi-currency-dollar text-money-gold text-xl"></i>
                    <i class="bi bi-currency-euro text-money-gold text-xl"></i>
                    <i class="bi bi-currency-yen text-money-gold text-xl"></i>
                    <i class="bi bi-currency-pound text-money-gold text-xl"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const loginButton = document.getElementById('login-button');
            const buttonText = document.getElementById('button-text');
            const loadingSpinner = document.getElementById('loading-spinner');

            if (loginForm) {
                loginForm.addEventListener('submit', function() {
                    // Show loading state immediately on submit
                    loginButton.disabled = true;
                    buttonText.classList.add('d-none');
                    loadingSpinner.classList.remove('d-none');

                    // No e.preventDefault() here, allowing Django's default form submission
                    // The loading state will be visible until the page redirects.
                });
            }
        });
    </script>
</body>
</html>
